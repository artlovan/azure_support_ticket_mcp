name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  BIN_NAME: azure-support-ticket-mcp

jobs:
  verify:
    name: verify version sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tag matches Cargo.toml and plugin.json
        run: |
          set -euo pipefail
          CARGO_VER=$(grep -E '^version = "' Cargo.toml | head -1 | cut -d'"' -f2)
          PLUGIN_VER=$(jq -r .version plugin/plugin.json)
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "tag=$GITHUB_REF_NAME  Cargo.toml=$CARGO_VER  plugin.json=$PLUGIN_VER"
          if [ "$CARGO_VER" != "$PLUGIN_VER" ]; then
            echo "::error::Cargo.toml ($CARGO_VER) and plugin/plugin.json ($PLUGIN_VER) versions disagree"
            exit 1
          fi
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VER (expected v$CARGO_VER)"
            exit 1
          fi

  build:
    needs: verify
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset_suffix: linux-x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            asset_suffix: linux-aarch64
            use_cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            asset_suffix: darwin-x86_64
            use_cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset_suffix: darwin-aarch64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset_suffix: windows-x86_64
            use_cross: false
            binary_extension: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable + target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (for aarch64 Linux)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cross

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Stage release asset (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${BIN_NAME}"
          DEST="dist/${BIN_NAME}-${{ matrix.asset_suffix }}"
          cp "$SRC" "$DEST"
          chmod +x "$DEST"
          ls -la "$DEST"

      - name: Stage release asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $src  = "target/${{ matrix.target }}/release/${env:BIN_NAME}.exe"
          $dest = "dist/${env:BIN_NAME}-${{ matrix.asset_suffix }}.exe"
          Copy-Item -Path $src -Destination $dest -Force
          Get-ChildItem $dest | Format-List

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.asset_suffix }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for install scripts)
        uses: actions/checkout@v6

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/

      - name: List downloaded binaries
        run: ls -la dist/

      - name: Compute SHA256 checksums
        run: |
          set -euo pipefail
          cd dist
          for f in ${BIN_NAME}-*; do
            shasum -a 256 "$f" | awk '{print $1}' > "${f}.sha256"
            echo "$f -> $(cat ${f}.sha256)"
          done
          ls -la

      - name: Copy install scripts into dist
        run: |
          set -euo pipefail
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          chmod +x dist/install.sh
          ls -la dist/

      - name: Detect prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.BIN_NAME }}-linux-x86_64
            dist/${{ env.BIN_NAME }}-linux-x86_64.sha256
            dist/${{ env.BIN_NAME }}-linux-aarch64
            dist/${{ env.BIN_NAME }}-linux-aarch64.sha256
            dist/${{ env.BIN_NAME }}-darwin-x86_64
            dist/${{ env.BIN_NAME }}-darwin-x86_64.sha256
            dist/${{ env.BIN_NAME }}-darwin-aarch64
            dist/${{ env.BIN_NAME }}-darwin-aarch64.sha256
            dist/${{ env.BIN_NAME }}-windows-x86_64.exe
            dist/${{ env.BIN_NAME }}-windows-x86_64.exe.sha256
            dist/install.sh
            dist/install.ps1
